<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מנהל מדיה אישי</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>מנהל מדיה אישי</h1>
        <p>הורדת קובצי מדיה מקישורים ישירים</p>
      </div>
      <button id="settingsButton" class="icon-button" type="button" aria-label="הגדרות" title="הגדרות">⚙</button>
    </header>

    <form id="downloadForm">
      <label for="mediaUrl">קישור ישיר לקובץ מדיה</label>
      <input id="mediaUrl" name="mediaUrl" type="url" placeholder="https://example.com/video.mp4" autocomplete="url" required>

      <div class="two-columns">
        <div>
          <label for="mediaType">סוג הקובץ</label>
          <select id="mediaType" name="mediaType">
            <option value="video">וידאו</option>
            <option value="audio">שמע</option>
          </select>
        </div>
        <div>
          <label for="quality">איכות</label>
          <select id="quality" disabled>
            <option>איכות מקורית</option>
          </select>
        </div>
      </div>

      <label for="fileName">שם הקובץ (לא חובה)</label>
      <input id="fileName" name="fileName" type="text" maxlength="120" placeholder="הקובץ שלי">

      <button id="downloadButton" class="download-button" type="submit">הורד קובץ</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <p class="notice">
      התוסף מוריד קובץ ישיר בלבד, ללא המרה או שינוי איכות. אין אפשרות להוריד דרכו סרטונים או שמע מ־YouTube.
      הורד רק קבצים שיש לך הרשאה להשתמש בהם.
    </p>
    <footer>
      <span id="folderInfo">תיקיית שמירה: Downloads/MediaHelper</span>
      <a href="options.html" id="optionsLink">הגדרות</a>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
